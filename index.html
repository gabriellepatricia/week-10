<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Squishy — Katalog &amp; Webstore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-header"></div>

  <!-- Hero Banner -->
  <section class="hero">
    <div class="container hero-box">
      <h2>Koleksi Squishy Gemas &amp; Wangi</h2>
      <p>Temukan berbagai pilihan squishy berkualitas tinggi, tekstur lembut, wangi manis, dan super slow rising untuk koleksi maupun penghilang stres.</p>
    </div>
  </section>

  <!-- Katalog Produk -->
  <main class="container page-main">
    <div class="section-title">
      <h3>Katalog Produk</h3>
      <span id="catalog-count">Menampilkan 31 Produk</span>
    </div>

    <div class="filter-bar" id="category-filters"></div>

    <div class="catalog-grid" id="catalog-container"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p><strong>Sushi Squishy</strong> &mdash; Jl. Mayjen Sungkono, Surabaya</p>
      <p class="copyright">&copy; 2026 Sushi Squishy.</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="script.js"></script>
  <script>
    (function () {
      const store = window.SSStore;
      store.renderHeader("katalog");

      const container = document.getElementById("catalog-container");
      const countLabel = document.getElementById("catalog-count");
      const filterBar = document.getElementById("category-filters");
      let activeCategory = "Semua";

      function getQtyInCart(productId) {
        const found = store.getCart().find(function (c) {
          return c.id === productId;
        });
        return found ? found.qty : 0;
      }

      function renderFilters() {
        const categories = ["Semua"];
        store.daftarSquishy.forEach(function (item) {
          if (categories.indexOf(item.kategori) === -1) {
            categories.push(item.kategori);
          }
        });

        filterBar.innerHTML = categories.map(function (cat) {
          const isActive = activeCategory === cat;
          return (
            '<button type="button" class="filter-chip ' + (isActive ? "active" : "") + '" data-cat="' + store.escapeHtml(cat) + '">' +
            store.escapeHtml(cat) +
            '</button>'
          );
        }).join("");
      }

      function renderKatalog() {
        const list = activeCategory === "Semua"
          ? store.daftarSquishy
          : store.daftarSquishy.filter(function (p) { return p.kategori === activeCategory; });

        countLabel.textContent = "Menampilkan " + list.length + " Produk" + (activeCategory !== "Semua" ? " (" + activeCategory + ")" : "");

        container.innerHTML = list.map(function (item) {
          const inCart = getQtyInCart(item.id);
          const badgeClass = item.badgeClass ? " " + store.escapeHtml(item.badgeClass) : "";
          const statusClass = item.status === "Stok Terbatas" ? "status status-limited" : "status";
          const btnClass = inCart > 0 ? "btn btn-primary btn-block in-cart btn-add-cart" : "btn btn-primary btn-block btn-add-cart";
          const btnText = inCart > 0
            ? "+ Tambah Lagi (" + inCart + " di keranjang)"
            : "+ Tambah ke Keranjang";

          return (
            '<article class="card">' +
            '  <div class="card-badge' + badgeClass + '">' + store.escapeHtml(item.badge) + '</div>' +
            '  <div class="card-image">' +
            '    <img src="' + store.escapeHtml(item.gambar) + '" alt="' + store.escapeHtml(item.nama) + '" loading="lazy">' +
            '  </div>' +
            '  <div class="card-body">' +
            '    <span class="category">' + store.escapeHtml(item.kategori) + '</span>' +
            '    <h4>' + store.escapeHtml(item.nama) + '</h4>' +
            '    <p class="desc">' + store.escapeHtml(item.deskripsi) + '</p>' +
            '    <div class="card-footer">' +
            '      <span class="price">' + store.escapeHtml(item.harga) + '</span>' +
            '      <span class="' + statusClass + '">' + store.escapeHtml(item.status) + '</span>' +
            '    </div>' +
            '    <button type="button" class="' + btnClass + '" data-id="' + store.escapeHtml(item.id) + '">' +
            '      ' + btnText +
            '    </button>' +
            '  </div>' +
            '</article>'
          );
        }).join("");
      }

      filterBar.addEventListener("click", function (e) {
        const chip = e.target.closest(".filter-chip");
        if (!chip) return;
        activeCategory = chip.getAttribute("data-cat");
        renderFilters();
        renderKatalog();
      });

      container.addEventListener("click", function (e) {
        const btn = e.target.closest(".btn-add-cart");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const item = store.daftarSquishy.find(function (p) { return p.id === id; });
        if (!item) return;

        store.addToCart(id, 1);
        store.showToast("🍥 " + item.nama + " masuk ke keranjang!");
        renderKatalog();
      });

      store.onRealtimeUpdate(function () {
        renderKatalog();
      });

      renderFilters();
      renderKatalog();
    })();
  </script>
</body>
</html>
