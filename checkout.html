<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Pesanan — Sushi Squishy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-header"></div>

  <section class="hero compact">
    <div class="container hero-box">
      <span class="step-pill">Langkah 2 dari 3</span>
      <h2>Checkout Pesanan</h2>
      <p>Lengkapi data penerima dan konfirmasi rincian pesanan sebelum membayar dengan QRIS.</p>
    </div>
  </section>

  <main class="container page-main">
    <div id="checkout-root"></div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p><strong>Sushi Squishy</strong> &mdash; Jl. Pelangi Manis No. 18, Bandung</p>
      <p class="copyright">&copy; 2025 Sushi Squishy. Simulasi Pemesanan &amp; Pembayaran QRIS.</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.SSStore;
      store.renderHeader("cart");

      const root = document.getElementById("checkout-root");
      let shippingKey = "regular";

      function renderCheckout() {
        const cart = store.getCart();
        if (cart.length === 0) {
          root.innerHTML =
            '<div class="panel empty-state">' +
            '  <h3>Tidak ada item untuk di-checkout</h3>' +
            '  <p>Keranjang belanjamu masih kosong. Silakan pilih squishy di katalog terlebih dahulu.</p>' +
            '  <a href="index.html" class="btn btn-primary">Buka Katalog</a>' +
            '</div>';
          return;
        }

        const shipInfo = store.SHIPPING_OPTIONS[shippingKey] || store.SHIPPING_OPTIONS.regular;
        const totals = store.getCartTotals(shipInfo.cost);

        const summaryItemsHtml = cart.map(function (item) {
          return (
            '<div class="summary-row" style="align-items:flex-start; gap:10px;">' +
            '  <span>' + store.escapeHtml(item.nama) + ' <small style="color:var(--text-muted);">&times;' + item.qty + '</small></span>' +
            '  <strong style="white-space:nowrap;">' + store.formatRupiah(item.hargaNum * item.qty) + '</strong>' +
            '</div>'
          );
        }).join("");

        root.innerHTML =
          '<form id="checkout-form" class="two-col">' +
          '  <section class="panel">' +
          '    <div class="panel-title"><span>Data Penerima &amp; Pengiriman</span></div>' +
          '    <div class="form-row">' +
          '      <div class="form-group">' +
          '        <label for="nama">Nama Lengkap *</label>' +
          '        <input type="text" id="nama" name="nama" class="form-control" placeholder="Contoh: Aurelia Putri" required>' +
          '      </div>' +
          '      <div class="form-group">' +
          '        <label for="telepon">No. WhatsApp / Telepon *</label>' +
          '        <input type="tel" id="telepon" name="telepon" class="form-control" placeholder="0812-xxxx-xxxx" required>' +
          '      </div>' +
          '    </div>' +
          '    <div class="form-row">' +
          '      <div class="form-group">' +
          '        <label for="kota">Kota / Kabupaten *</label>' +
          '        <input type="text" id="kota" name="kota" class="form-control" placeholder="Contoh: Bandung" required>' +
          '      </div>' +
          '      <div class="form-group">' +
          '        <label for="shipping">Metode Pengiriman</label>' +
          '        <select id="shipping" name="shipping" class="form-control">' +
          '          <option value="regular" ' + (shippingKey === "regular" ? "selected" : "") + '>Kurir Reguler + Bubble Wrap (Rp 15.000)</option>' +
          '          <option value="express" ' + (shippingKey === "express" ? "selected" : "") + '>Kurir Instan / Same Day Bandung (Rp 25.000)</option>' +
          '          <option value="pickup" ' + (shippingKey === "pickup" ? "selected" : "") + '>Ambil di Toko Bandung (Gratis)</option>' +
          '        </select>' +
          '      </div>' +
          '    </div>' +
          '    <div class="form-group">' +
          '      <label for="alamat">Alamat Lengkap *</label>' +
          '      <textarea id="alamat" name="alamat" rows="3" class="form-control" placeholder="Nama jalan, nomor rumah, RT/RW, kecamatan, kode pos" required></textarea>' +
          '    </div>' +
          '    <div class="form-group">' +
          '      <label for="catatan">Catatan Tambahan (Opsional)</label>' +
          '      <input type="text" id="catatan" name="catatan" class="form-control" placeholder="Contoh: Tolong pakai bubble wrap ekstra / bungkus kado">' +
          '    </div>' +
          '    <div class="panel-title" style="margin-top:20px;"><span>Metode Pembayaran</span></div>' +
          '    <div class="payment-option">' +
          '      <div>' +
          '        <div class="payment-option-title">QRIS (Pembayaran Instan)</div>' +
          '        <div class="payment-option-desc">Bayar dengan scan kode QRIS melalui e-wallet atau mobile banking. Status diverifikasi otomatis secara realtime.</div>' +
          '      </div>' +
          '      <span class="status-badge status-paid">Aktif</span>' +
          '    </div>' +
          '  </section>' +
          '  <aside class="panel">' +
          '    <div class="panel-title"><span>Ringkasan Pesanan</span></div>' +
          '    ' + summaryItemsHtml +
          '    <hr class="summary-divider">' +
          '    <div class="summary-row">' +
          '      <span>Subtotal</span>' +
          '      <strong id="co-subtotal">' + store.formatRupiah(totals.subtotal) + '</strong>' +
          '    </div>' +
          '    <div class="summary-row">' +
          '      <span>Ongkos Kirim</span>' +
          '      <strong id="co-ongkir">' + (totals.ongkir === 0 ? "Gratis" : store.formatRupiah(totals.ongkir)) + '</strong>' +
          '    </div>' +
          '    <hr class="summary-divider">' +
          '    <div class="summary-total">' +
          '      <span>Grand Total</span>' +
          '      <span id="co-grandtotal">' + store.formatRupiah(totals.grandTotal) + '</span>' +
          '    </div>' +
          '    <button type="submit" class="btn btn-primary btn-block">Buat Pesanan &amp; Bayar QRIS &rarr;</button>' +
          '    <a href="cart.html" class="btn btn-outline btn-block" style="margin-top:10px;">&larr; Kembali ke Keranjang</a>' +
          '  </aside>' +
          '</form>';

        const shippingSelect = document.getElementById("shipping");
        shippingSelect.addEventListener("change", function () {
          shippingKey = shippingSelect.value;
          const info = store.SHIPPING_OPTIONS[shippingKey] || store.SHIPPING_OPTIONS.regular;
          const t = store.getCartTotals(info.cost);
          document.getElementById("co-ongkir").textContent = t.ongkir === 0 ? "Gratis" : store.formatRupiah(t.ongkir);
          document.getElementById("co-grandtotal").textContent = store.formatRupiah(t.grandTotal);
        });

        const form = document.getElementById("checkout-form");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          const customer = {
            nama: document.getElementById("nama").value.trim(),
            telepon: document.getElementById("telepon").value.trim(),
            kota: document.getElementById("kota").value.trim(),
            alamat: document.getElementById("alamat").value.trim(),
            catatan: document.getElementById("catatan").value.trim()
          };
          const order = store.createOrder(customer, shippingKey);
          if (order) {
            window.location.href = "payment.html?order=" + encodeURIComponent(order.id);
          }
        });
      }

      renderCheckout();
    })();
  </script>
</body>
</html>
